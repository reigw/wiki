[workspace]
authors = ["Vorschreibung <vorschreibung@gmail.com>"]
channels = ["conda-forge"]
name = "igw-wiki"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
"watch" = { "cmd" = ["sphinx-autobuild", ".", "_build/html", "--ignore", ".pixi", "--ignore", "tmp", "--ignore", "_build"] }

[dependencies]
"sphinx" = "9.2.0.*"
"sphinx-autobuild" = "2025.8.25.*"
"make" = "4.4.1.*"
